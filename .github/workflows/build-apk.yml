name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Secrets and Keystore
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          
          # Force append the GEMINI_API_KEY to ensure compilation succeeds even if commented out in repo
          echo "" >> .env
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" >> .env
          
          # Provide a mock google-services.json to satisfy the Google Services plugin
          mkdir -p app
          echo '{"project_info":{"project_number":"123456789","firebase_url":"https://mock.firebaseio.com","project_id":"mock-project","storage_bucket":"mock.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.example"}},"oauth_client":[],"api_key":[{"current_key":"mock_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}' > app/google-services.json

          # Decode or generate debug.keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          # Optimize Gradle for GitHub Actions (1 worker, 5GB RAM)
          # We use sed to replace the existing values in gradle.properties to avoid duplicates
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/g' gradle.properties
          sed -i 's/org.gradle.parallel=true/org.gradle.parallel=false/g' gradle.properties
          sed -i 's/org.gradle.workers.max=4/org.gradle.workers.max=1/g' gradle.properties
          
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Search-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
